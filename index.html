<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="move app — a lighter way to track your workouts"
    />
    <title>move — a lighter way to track your workouts</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-reveal");
      }
    </script>
  </head>
  <body>
    <main class="landing">
      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone reveal">
            <img
              src="images/log.png"
              alt="move app home screen with one-tap workout logging"
              width="560"
              height="1167"
            />
          </figure>
          <div class="panel-copy reveal">
            <h1>move app</h1>
            <p>a lighter way to track your workouts</p>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone reveal">
            <img
              src="images/calendar.png"
              alt="Calendar view with notes and workouts for a day"
              width="560"
              height="1167"
            />
          </figure>
          <p class="panel-copy reveal">add workouts and notes to any day</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone reveal">
            <img
              src="images/patterns.png"
              alt="Activity rhythms with sparklines for each workout"
              width="560"
              height="1167"
            />
          </figure>
          <p class="panel-copy reveal">see your rhythms over time</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone reveal">
            <img
              src="images/edit.png"
              alt="Choose which workouts appear in your list"
              width="560"
              height="1167"
            />
          </figure>
          <p class="panel-copy reveal">choose what you track</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone reveal">
            <img
              src="images/custom.png"
              alt="Create a custom workout with name and icon"
              width="560"
              height="1167"
            />
          </figure>
          <p class="panel-copy reveal">create a workout of your own</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 move. all rights reserved.</p>
        <a href="privacy.html">privacy policy</a>
      </div>
    </footer>
    <script src="reveal.js"></script>
  </body>
</html>
