<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="move app — a lighter way to track your workouts"
    />
    <title>move — a lighter way to track your workouts</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-reveal");
      }
    </script>
  </head>
  <body>
    <main class="landing">
      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone demo-phone reveal" aria-label="Interactive demo of the move app workout screen">
            <div class="demo-screen">
              <div class="demo-status" aria-hidden="true">
                <span>3:12</span>
                <span class="demo-island"></span>
                <svg width="78" height="13" viewBox="0 0 78 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M19.2 1.53301C19.2 0.899963 18.7224 0.38678 18.1333 0.38678H17.0667C16.4776 0.38678 16 0.899963 16 1.53301V11.467C16 12.1 16.4776 12.6132 17.0667 12.6132H18.1333C18.7224 12.6132 19.2 12.1 19.2 11.467V1.53301ZM11.7659 2.83206H12.8326C13.4217 2.83206 13.8992 3.35756 13.8992 4.0058V11.4395C13.8992 12.0877 13.4217 12.6132 12.8326 12.6132H11.7659C11.1768 12.6132 10.6992 12.0877 10.6992 11.4395V4.0058C10.6992 3.35756 11.1768 2.83206 11.7659 2.83206ZM7.43411 5.48111H6.36745C5.77834 5.48111 5.30078 6.0133 5.30078 6.66979V11.4245C5.30078 12.081 5.77834 12.6132 6.36745 12.6132H7.43411C8.02322 12.6132 8.50078 12.081 8.50078 11.4245V6.66979C8.50078 6.0133 8.02322 5.48111 7.43411 5.48111ZM2.13333 7.9264H1.06667C0.477563 7.9264 0 8.45099 0 9.0981V11.4415C0 12.0886 0.477563 12.6132 1.06667 12.6132H2.13333C2.72244 12.6132 3.2 12.0886 3.2 11.4415V9.0981C3.2 8.45099 2.72244 7.9264 2.13333 7.9264Z" fill="black" style="fill:black;fill-opacity:1;"/>

                  <rect opacity="0.35" x="50.8417" y="0.5" width="24" height="12" rx="3.8" stroke="black" style="stroke:black;stroke-opacity:1;"/>
                  <path opacity="0.4" d="M76.3417 4.78113V8.8566C77.1464 8.51143 77.6697 7.70847 77.6697 6.81886C77.6697 5.92926 77.1464 5.1263 76.3417 4.78113" fill="black" style="fill:black;fill-opacity:1;"/>
                  <rect x="52.3417" y="2" width="21" height="9" rx="2.5" fill="black" style="fill:black;fill-opacity:1;"/>
                  </svg>

              </div>

              <div class="demo-grid">
                <button class="demo-workout" type="button" data-workout="walking">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-walking.svg" alt="" />
                  <span>walking</span>
                </button>
                <button class="demo-workout" type="button" data-workout="running">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-running.svg" alt="" />
                  <span>running</span>
                </button>
                <button class="demo-workout" type="button" data-workout="strength">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-lifting.svg" alt="" />
                  <span>strength</span>
                </button>
                <button class="demo-workout" type="button" data-workout="yoga">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-yoga.svg" alt="" />
                  <span>yoga</span>
                </button>
                <button class="demo-workout" type="button" data-workout="cycling">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-biking.svg" alt="" />
                  <span>cycling</span>
                </button>
                <button class="demo-workout" type="button" data-workout="pilates">
                  <span class="demo-workout-progress"></span>
                  <img src="images/workout-pilates.svg" alt="" />
                  <span>pilates</span>
                </button>
              </div>

              <div class="demo-toolbar" aria-hidden="true">
                <span class="demo-edit">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h9m4 0h3M4 12h3m4 0h9M4 17h9m4 0h3" />
                    <circle cx="15" cy="7" r="2" />
                    <circle cx="9" cy="12" r="2" />
                    <circle cx="15" cy="17" r="2" />
                  </svg>
                </span>
                <span class="demo-tabs">
                  <b><img src="images/tab-check.svg" alt="" /></b>
                  <i><img src="images/tab-calendar.svg" alt="" /></i>
                  <i><img src="images/tab-stats.svg" alt="" /></i>
                  <i><img src="images/tab-settings.svg" alt="" /></i>
                </span>
              </div>
              <p class="visually-hidden" aria-live="polite" data-demo-status></p>
            </div>
          </figure>
          <div class="panel-copy reveal">
            <h1>move — a lighter way to track your workouts</h1>
            <p class="panel-pricing">$2.99 / month after a 14-day free trial</p>
            <a
              class="app-store-badge"
              href="https://apps.apple.com/us/app/move-workout-tracker/id6801334936"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="Download_on_the_App_Store_Badge_US-UK_RGB_wht_092917.svg"
                alt=""
                width="120"
                height="40"
              />
              <span class="visually-hidden">
                Download on the App Store (opens in a new tab)
              </span>
            </a>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone demo-phone calendar-demo-phone reveal" aria-label="Interactive demo of the move app calendar">
            <div class="demo-screen calendar-demo-screen" data-calendar-demo>
              <div data-calendar-status></div>

              <button class="calendar-sticky-header" type="button" tabindex="-1">july 2026</button>

              <div class="calendar-scroll" data-calendar-scroll>
                <h2 class="calendar-month-title">july 2026</h2>
                <div class="calendar-days" data-calendar-days></div>
              </div>

              <div class="calendar-toolbar" aria-hidden="true">
                <span class="demo-tabs">
                  <i><img src="images/tab-check.svg" alt="" /></i>
                  <b><img src="images/tab-calendar.svg" alt="" /></b>
                  <i><img src="images/tab-stats.svg" alt="" /></i>
                  <i><img src="images/tab-settings.svg" alt="" /></i>
                </span>
              </div>

              <div class="calendar-sheet-layer" data-calendar-sheet-layer hidden>
                <button class="calendar-sheet-backdrop" type="button" data-calendar-sheet-dismiss aria-label="Close"></button>
                <section class="calendar-sheet" role="dialog" aria-modal="true" aria-labelledby="calendar-sheet-title">
                  <header class="calendar-sheet-header">
                    <h3 id="calendar-sheet-title" data-calendar-sheet-title></h3>
                    <button class="calendar-sheet-close" type="button" data-calendar-sheet-close aria-label="Close">×</button>
                  </header>
                  <div class="calendar-workout-picker" data-calendar-workout-picker></div>
                </section>
              </div>

              <div class="calendar-sheet-layer" data-note-sheet-layer hidden>
                <button class="calendar-sheet-backdrop" type="button" data-note-cancel aria-label="Cancel"></button>
                <section class="calendar-sheet calendar-note-sheet" role="dialog" aria-modal="true" aria-labelledby="note-sheet-title">
                  <header class="calendar-sheet-header calendar-note-header">
                    <button class="calendar-sheet-close" type="button" data-note-cancel aria-label="Cancel">×</button>
                    <h3 id="note-sheet-title" data-note-sheet-title></h3>
                    <button class="calendar-note-save" type="button" data-note-save aria-label="Save note">✓</button>
                  </header>
                  <textarea data-note-input aria-label="Note"></textarea>
                </section>
              </div>
            </div>
          </figure>
          <p class="panel-copy reveal">add workouts and notes to any day</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone demo-phone stats-demo-phone reveal" aria-label="Interactive demo of move workout statistics">
            <div class="demo-screen stats-demo-screen" data-stats-demo>
              <div data-stats-status></div>

              <div class="stats-sticky-header" data-stats-sticky-title></div>

              <div class="stats-scroll" data-stats-scroll>
                <h2 class="stats-date-title" data-stats-date-title></h2>
                <div class="stats-range-picker" role="group" aria-label="History range">
                  <button type="button" data-stats-range="month" aria-pressed="true">1M</button>
                  <button type="button" data-stats-range="sixMonths" aria-pressed="false">6M</button>
                  <button type="button" data-stats-range="year" aria-pressed="false">1Y</button>
                  <button type="button" data-stats-range="allTime" aria-pressed="false">All</button>
                </div>
                <div class="stats-cards" data-stats-cards></div>
              </div>

              <div class="stats-toolbar" aria-hidden="true">
                <span class="demo-tabs">
                  <i><img src="images/tab-check.svg" alt="" /></i>
                  <i><img src="images/tab-calendar.svg" alt="" /></i>
                  <b><img src="images/tab-stats.svg" alt="" /></b>
                  <i><img src="images/tab-settings.svg" alt="" /></i>
                </span>
              </div>
            </div>
          </figure>
          <p class="panel-copy reveal">see your rhythms over time</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone demo-phone workout-editor-demo-phone reveal" aria-label="Interactive demo for choosing which workouts to track">
            <div class="demo-screen workout-editor-demo-screen" data-workout-editor-demo>
              <div data-workout-editor-status></div>

              <section class="workout-editor-view is-active" data-workout-editor-view aria-label="Edit workouts">
                <header class="workout-editor-header">
                  <strong>edit workouts</strong>
                  <button type="button" data-workout-editor-done>done</button>
                </header>
                <div class="workout-editor-scroll" data-workout-editor-scroll>
                  <div class="workout-editor-grid" data-workout-editor-grid></div>
                </div>
              </section>

              <section class="workout-complete-view" data-workout-complete-view aria-label="Complete a workout" aria-hidden="true">
                <div class="demo-grid workout-editor-complete-grid" data-workout-complete-grid></div>
                <div class="demo-toolbar workout-editor-toolbar">
                  <button class="demo-edit workout-editor-edit-button" type="button" data-workout-editor-open aria-label="Edit workouts">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 7h9m4 0h3M4 12h3m4 0h9M4 17h9m4 0h3" />
                      <circle cx="15" cy="7" r="2" />
                      <circle cx="9" cy="12" r="2" />
                      <circle cx="15" cy="17" r="2" />
                    </svg>
                  </button>
                  <span class="demo-tabs" aria-hidden="true">
                    <b><img src="images/tab-check.svg" alt="" /></b>
                    <i><img src="images/tab-calendar.svg" alt="" /></i>
                    <i><img src="images/tab-stats.svg" alt="" /></i>
                    <i><img src="images/tab-settings.svg" alt="" /></i>
                  </span>
                </div>
              </section>

              <p class="visually-hidden" aria-live="polite" data-workout-editor-announcement></p>
            </div>
          </figure>
          <p class="panel-copy reveal">choose what you track</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner">
          <figure class="panel-phone demo-phone custom-workout-demo-phone reveal" aria-label="Interactive demo for creating a custom workout">
            <div class="demo-screen custom-workout-demo-screen" data-custom-workout-demo>
              <div data-custom-workout-status></div>

              <header class="custom-workout-editor-header">
                <strong>edit workouts</strong>
              </header>

              <div class="custom-workout-editor-scroll" data-custom-workout-scroll>
                <div class="workout-editor-grid" data-custom-workout-grid></div>
              </div>

              <div class="custom-workout-sheet-layer is-open" data-custom-workout-layer aria-hidden="false">
                <button class="custom-workout-backdrop" type="button" data-custom-workout-cancel aria-label="Close new workout editor"></button>
                <form class="custom-workout-sheet" data-custom-workout-form aria-labelledby="custom-workout-title">
                  <header class="custom-workout-sheet-header">
                    <button class="custom-workout-sheet-button" type="button" data-custom-workout-cancel aria-label="Cancel">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
                    </button>
                    <h3 id="custom-workout-title">new workout</h3>
                    <button class="custom-workout-sheet-button is-save" type="submit" data-custom-workout-save aria-label="Save workout" disabled>
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4 4 9-10" /></svg>
                    </button>
                  </header>

                  <input
                    class="custom-workout-name"
                    type="text"
                    data-custom-workout-name
                    placeholder="workout name"
                    aria-label="Workout name"
                    autocomplete="off"
                    autocapitalize="words"
                  />
                  <div class="custom-workout-icon-grid" data-custom-workout-icons role="radiogroup" aria-label="Workout illustration"></div>
                </form>
              </div>

              <p class="visually-hidden" aria-live="polite" data-custom-workout-announcement></p>
            </div>
          </figure>
          <p class="panel-copy reveal">create a workout of your own</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 move. all rights reserved.</p>
        <nav class="footer-links" aria-label="Footer">
          <a href="privacy.html">privacy policy</a>
        </nav>
      </div>
    </footer>
    <script src="reveal.js"></script>
    <script src="demo-data.js"></script>
    <script src="demo.js"></script>
    <script src="calendar-demo.js"></script>
    <script src="stats-demo.js"></script>
    <script src="workout-editor-demo.js"></script>
    <script src="custom-workout-demo.js"></script>
  </body>
</html>
